[project]
name = "Vantaray"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0",
    "certifi>=2026.10.23",
    "cffi>=2.1.1",
    "click>=8.5.1",
    "cryptography>=50.0.2",
    "deprecated>=3.0.1",
    "fastapi>=0.162.7",
    "json5>=0.10",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "httptools>=0.9.0",
    "jdatetime>=6.1.1",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.4",
    "packaging>=25.0",
    "psutil>=7.2.2",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.4",
    "pyopenssl>=26.4.0",
    "pysocks>=1.7.1",
    "pytelegrambotapi>=4.37.1",
    "python-dateutil>=4.0.0",
    "python-decouple>=3.8",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rpyc>=6.0.2",
    "rsa>=4.9.1",
    "sniffio>=1.3.1",
    "sqlalchemy>=2.1.8",
    "starlette>=1.10.0",
    "typer>=0.29.1",
    "urllib3>=2.8.0",
    "uvicorn>=0.54.0",
    "websocket-client>=1.9.2",
    "websockets>=17.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]

[tool.poe.tasks]
lint              = "ruff check ."
fmt               = "ruff format ."
xray-proto-update = "python xray_api/proto/compile.py"


[tool.uv]
required-version = "==0.13.10"

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "app/db/migrations/versions",
    "xray_api",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    "B904",
    "SIM108",
    "UP042"
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli", "xray_api", "config"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"config.py" = ["E402"]
"conftest.py" = ["E402", "F401"]
"app/db/migrations/env.py" = ["E402", "F401"]
"**/__init__.py" = ["F401"]   # реэкспорт

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
