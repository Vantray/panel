repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        # clash/default.yml is a Jinja2 template, only valid YAML after rendering
        exclude: ^app/templates/clash/default\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # build artifacts are regenerated by the dashboard build, don't touch them
        exclude: ^dashboard/dist/
      - id: trailing-whitespace
        exclude: ^dashboard/dist/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
