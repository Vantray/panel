name: Build dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "app/**"
      - "xray_api/**"
      - "cli/**"
      - ".github/workflows/build-dev.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            # vantray/panel
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          provenance: mode=max
          sbom: true

  release:
    name: Publish dev release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Replace dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed" >&2
              sleep $((i * 5))
            done
            return 1
          }
          
          short="${COMMIT::7}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          built="$(date -u '+%Y-%m-%d %H:%M UTC')"
          subject="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}" --jq '.commit.message' | head -n1)"
          
          cat > notes.md <<EOF
          > ⚠️ **Automatic dev build from the \`main\` branch.** May be unstable, not suitable for production.
          
          | | |
          |---|---|
          | **Build date** | ${built} |
          | **Commit** | [\`${COMMIT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT}) |
          EOF
          sed -i 's/^          //' notes.md
          
          gh release delete dev-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          
          retry gh release create dev-latest --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Dev build ${short}" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
