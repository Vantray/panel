name: Feature request
description: Suggest an idea or improvement for Vantray
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Before submitting, please:
        - Search [existing issues](https://github.com/Vantray/panel/issues) and [discussions](https://github.com/Vantray/panel/discussions) to check whether the idea has already been proposed.
        - Keep one feature per request.

        If you only have a question or an early idea you want feedback on, please use Discussions instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions, and this has not been requested yet.
          required: true
        - label: This request is about a single, specific feature or improvement.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve? Describe the situation where the current behavior falls short.
      placeholder: I'm always frustrated when I have to ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work. Mockups, example API calls, or config snippets are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Related component
      multiple: true
      options:
        - Dashboard (web UI)
        - REST API
        - Subscription links
        - Telegram bot
        - Discord bot
        - CLI
        - Installation script
        - Backup service
        - Webhooks
        - Xray configuration / protocols
        - Other
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would improve my workflow
        - Blocking my use case
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to implement it?
      options:
        - "No"
        - "Yes, I can open a pull request"
        - "Yes, but I need guidance"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, related projects, or client apps where this feature already exists.
    validations:
      required: false